services:
  traefik:
    image: docker.io/traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    command:
      # API and dashboard
      - "--api.dashboard=true"
      - "--api.debug=false"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Docker/Podman provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-network"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"

      # Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=eddie@hashkeeper.dev"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"

      # HTTP to HTTPS redirect
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

    labels:
      - "traefik.enable=true"

      # Dashboard router
      - "traefik.http.routers.dashboard.rule=Host(`${SUBDOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth,hsts-headers"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${ADMINCREDS}"

      # Security headers
      - "traefik.http.middlewares.hsts-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.hsts-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.hsts-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.hsts-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.hsts-headers.headers.forceSTSHeader=true"

    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt:Z"
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"

    networks:
      - traefik-network

networks:
  traefik-network:
    external: true
